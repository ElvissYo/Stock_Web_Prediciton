name: Daily Pipeline Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 1-5"

jobs:
  daily-pipeline-smoke:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/local-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data,ml]"

      - name: Configure local environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=ci
          LOG_LEVEL=INFO
          NEO4J_URI=bolt://localhost:7687
          NEO4J_USERNAME=neo4j
          NEO4J_PASSWORD=local-password
          NEO4J_DATABASE=neo4j
          EOF

      - name: Run lightweight daily update
        run: >
          python scripts/run_daily_update.py
          --price-period 1mo
          --min-correlation-observations 20
          --skip-prediction

      - name: Verify generated dataset
        run: |
          test -s data/processed/training_features.csv

