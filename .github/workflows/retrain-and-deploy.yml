name: Retrain and Deploy to Hugging Face Space

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

jobs:
  retrain-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      RETRAIN_MODE: lite
      MAX_TICKERS: 30
      NEWS_LIMIT: 1000
      HF_USERNAME: ${{ secrets.HF_USERNAME }}
      HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile scripts/run_web_dashboard.py
          python -m py_compile kag/web/api.py

      - name: Run retraining pipeline
        run: |
          python scripts/collect_prices.py
          python scripts/collect_news.py --provider gdelt --limit "$NEWS_LIMIT"
          python scripts/build_price_features.py
          python scripts/build_nlp_features.py --sentiment-backend lexicon --embedding-backend hashing
          python scripts/build_final_dataset.py
          python scripts/train_baseline.py
          python scripts/train_global_model.py
          python scripts/evaluate_models.py

      - name: Validate runtime artifacts
        run: |
          python scripts/validate_runtime_artifacts.py

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Deploy updated project to Hugging Face Space
        run: |
          rm -rf /tmp/hf-space
          git clone https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME} /tmp/hf-space

          rsync -av \
            --exclude ".git" \
            --exclude "__pycache__" \
            --exclude ".pytest_cache" \
            --exclude ".venv" \
            --exclude "venv" \
            --exclude "node_modules" \
            ./ /tmp/hf-space/

          cd /tmp/hf-space
          git lfs install
          git lfs track "*.parquet" "*.joblib" "*.pkl" "*.png" "models/*.txt"
          git add .gitattributes
          git add .

          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Update artifacts from scheduled retrain"
            git push
          fi